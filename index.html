<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:200 900;font-display:swap;src:url(fonts/source-serif-4-latin-opsz-normal.woff2) format("woff2-variations"),url(fonts/source-serif-4-latin-opsz-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
</style>
<meta name="robots" content="noindex, nofollow">
<title>Geschütztes Dokument</title>
<style>
/* Layout: one reading column for text, wider measure for tables and charts; decision first, evidence folded below */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#14202b; --ink-2:#3a4855; --muted:#5f6d7a; --line:#d5dce2; --grid:#e7ecf0;
  --accent:#1f4fd1; --accent-ink:#1a3fae; --accent-soft:#e7edfb; --band:#e1e7ee; --bar:#b3bfca; --cur:#3a4855;
  --warn:#9e3627; --warn-soft:#f7e8e5; --ok:#1d6b4d; --ok-soft:#e3f1ea; --shadow:rgba(20,32,43,.10);
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --measure:44rem; --wide:66rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --surface:#151c23; --ink:#e5ebf0; --ink-2:#c2cbd4; --muted:#97a4b1; --line:#2b3641; --grid:#212b35;
  --accent:#86a6ff; --accent-ink:#a8bfff; --accent-soft:#1a2746; --band:#25313d; --bar:#4b5967; --cur:#c2cbd4;
  --warn:#ff9b88; --warn-soft:#37201c; --ok:#71d2a9; --ok-soft:#142e27; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#151c23; --ink:#e5ebf0; --ink-2:#c2cbd4; --muted:#97a4b1; --line:#2b3641; --grid:#212b35;
  --accent:#86a6ff; --accent-ink:#a8bfff; --accent-soft:#1a2746; --band:#25313d; --bar:#4b5967; --cur:#c2cbd4;
  --warn:#ff9b88; --warn-soft:#37201c; --ok:#71d2a9; --ok-soft:#142e27; --shadow:rgba(0,0,0,.45); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:1.0625rem; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg)}
.wrap{max-width:var(--wide); margin-inline:auto}
a{color:var(--accent-ink); text-decoration-thickness:1px; text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
[id]{scroll-margin-top:4.5rem}
h1,h2,h3,h4{font-family:var(--f-display); text-wrap:balance; line-height:1.2; margin:0}
h2{font-size:1.75rem; font-weight:600; margin-bottom:1rem}
h3{font-size:1.2rem; font-weight:600; margin:2rem 0 .75rem}
h4{font-size:1.05rem; font-weight:600; margin:1.5rem 0 .5rem}
p,ul,ol{max-width:var(--measure); margin:0 0 1rem}
ul,ol{padding-left:1.3rem}
li{margin-bottom:.4rem}
strong{font-weight:700}
.sec-label, .doc-type{font-size:.85rem; font-weight:700; color:var(--muted); margin:0 0 .6rem}

/* masthead */
.mast{padding-block:2.25rem 1.75rem; border-bottom:1px solid var(--line)}
.mast h1{font-size:clamp(1.55rem, 3.4vw, 2.2rem); font-weight:600; max-width:46rem; margin-bottom:1.5rem}
.frame{margin:0; max-width:var(--wide); border-top:1px solid var(--line)}
.frame>div{display:grid; grid-template-columns:9rem minmax(0,1fr); gap:.2rem 1.5rem; padding-block:.55rem; border-bottom:1px solid var(--line)}
.frame dt{font-size:.85rem; font-weight:700; color:var(--muted); padding-top:.1rem}
.frame dd{margin:0; font-size:.95rem; color:var(--ink-2); max-width:var(--measure)}
@media (max-width:640px){.frame>div{grid-template-columns:1fr}}

/* sticky section nav */
.toc{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.toc-bar{position:relative}
.toc-links{display:flex; gap:1.25rem; overflow-x:auto; white-space:nowrap; padding-block:.7rem; scrollbar-width:thin}
.toc a{color:var(--ink-2); text-decoration:none; font-size:.9rem}
.toc a:hover{color:var(--accent-ink); text-decoration:underline}
.toc a[aria-current="true"]{color:var(--ink); font-weight:700}
.toc-toggle{display:none}
@media (max-width:640px){
  .toc-toggle{display:flex; width:100%; align-items:center; justify-content:space-between; gap:1rem; font:inherit; color:var(--ink); background:none; border:0; padding:.75rem 0; cursor:pointer; text-align:left}
  .toc-current{font-weight:700; font-size:.95rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .toc-btn{display:inline-flex; align-items:center; gap:.6rem; font-size:.9rem; color:var(--ink-2); flex:none}
  .burger{position:relative; display:inline-block; width:1.1rem; height:2px; background:currentColor}
  .burger::before, .burger::after{content:""; position:absolute; left:0; width:100%; height:2px; background:currentColor; transition:transform .15s}
  .burger::before{top:-6px} .burger::after{top:6px}
  .toc.open .burger{background:transparent}
  .toc.open .burger::before{transform:translateY(6px) rotate(45deg)}
  .toc.open .burger::after{transform:translateY(-6px) rotate(-45deg)}
  .toc-links{display:none; position:absolute; top:100%; left:calc(-1 * max(16px, env(safe-area-inset-left, 0px))); right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
    flex-direction:column; gap:0; white-space:normal; padding:0 max(16px, env(safe-area-inset-right, 0px)) .5rem max(16px, env(safe-area-inset-left, 0px));
    background:var(--bg); border-bottom:1px solid var(--line); box-shadow:0 10px 18px var(--shadow); max-height:calc(100vh - 5rem); overflow-y:auto}
  .toc.open .toc-links{display:flex}
  .toc-links a{padding:.75rem 0; border-top:1px solid var(--line); font-size:1rem}
}
@media (prefers-reduced-motion: reduce){.burger::before, .burger::after{transition:none}}

/* decision */
.verdict{padding-block:2.25rem 1rem}
.governing{font-family:var(--f-display); font-weight:600; font-size:clamp(1.2rem, 2.1vw, 1.45rem); line-height:1.35; max-width:52rem; margin:0 0 2rem}
.args{max-width:var(--wide); border-top:2px solid var(--ink); margin-bottom:2.5rem}
.arg{display:grid; grid-template-columns:9rem minmax(0,1fr); gap:.4rem 1.5rem; padding-block:1rem; border-bottom:1px solid var(--line)}
.arg-label{font-size:.85rem; font-weight:700; color:var(--muted); padding-top:.15rem}
.arg-head{font-weight:700; margin:0 0 .3rem}
.arg-ev{margin:0; font-size:.95rem; color:var(--ink-2)}
@media (max-width:640px){.arg{grid-template-columns:1fr}}
.ok-line{background:var(--ok-soft); border-radius:6px; padding:.85rem 1.15rem; max-width:var(--measure); margin-bottom:1rem}
.ok-line strong{color:var(--ok)}
.avoid{background:var(--warn-soft); border-radius:6px; padding:.85rem 1.15rem 0.35rem; max-width:var(--measure); margin-bottom:1rem}
.avoid .a-title{font-weight:700; color:var(--warn); margin:0 0 .4rem}
.avoid ul{margin-bottom:.6rem}
.avoid .a-note{font-size:.88rem; color:var(--ink-2); margin:0 0 .6rem}
.assume{font-size:.92rem; color:var(--muted); border-top:1px solid var(--line); padding-top:.9rem; margin-top:1.5rem}
ol.steps{counter-reset:s; list-style:none; padding:0}
ol.steps>li{counter-increment:s; position:relative; padding-left:2.4rem; margin-bottom:.9rem}
ol.steps>li::before{content:counter(s); position:absolute; left:0; top:.05rem; width:1.6rem; height:1.6rem; border-radius:50%;
  border:1.5px solid var(--ink-2); color:var(--ink); font-family:var(--f-mono); font-size:.8rem; display:grid; place-items:center}

/* sections */
.sec{padding-block:2.5rem 1rem; border-top:1px solid var(--line)}

/* tables */
.table-wrap{overflow-x:auto; margin:0 0 1.25rem; border:1px solid var(--line); border-radius:6px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:.9rem; line-height:1.45}
.table-wrap.c4 table{min-width:34rem} .table-wrap.c5 table{min-width:40rem} .table-wrap.c6 table, .table-wrap.c7 table, .table-wrap.c8 table{min-width:44rem}
th{text-align:left; font-weight:700; color:var(--ink-2); background:var(--grid); padding:.55rem .7rem; vertical-align:bottom}
td{padding:.55rem .7rem; border-top:1px solid var(--line); vertical-align:top}
td.num{font-variant-numeric:tabular-nums; white-space:nowrap}
tr.current td{background:var(--accent-soft)}

/* charts */
.chart{margin:1.5rem 0; padding:1.1rem 1.1rem .8rem; background:var(--surface); border:1px solid var(--line); border-radius:6px}
.chart figcaption{margin-bottom:.6rem}
.c-title{display:block; font-weight:700; font-size:1.02rem; line-height:1.35}
.c-sub{display:block; color:var(--muted); font-size:.85rem}
.legend{display:flex; flex-wrap:wrap; gap:.35rem 1.1rem; font-size:.8rem; color:var(--muted); margin:.4rem 0 .6rem}
.legend span{display:inline-flex; align-items:center; gap:.4rem}
.lg-dot{width:.65rem; height:.65rem; border-radius:50%; display:inline-block}
.lg-dot.lo{background:var(--surface); border:2px solid var(--ink-2)}
.lg-dot.hi{background:var(--ink-2)}
.lg-band{width:1.1rem; height:.75rem; background:var(--band); border-left:1px dashed var(--muted); border-right:1px dashed var(--muted); display:inline-block}
.c-grid{display:grid}
.c-row{display:grid; grid-template-columns:minmax(8rem, 13.5rem) minmax(0,1fr) 6.6rem; column-gap:.8rem; align-items:center}
.c-label{font-size:.84rem; text-align:right; color:var(--ink-2); line-height:1.25}
.c-val{font-family:var(--f-mono); font-size:.76rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.c-track{position:relative; height:1.95rem; background-image:linear-gradient(to right, var(--grid) 1px, transparent 1px); background-size:calc(100% / 6) 100%}
.bars .c-track{background-size:calc(100% / 3) 100%}
.band{position:absolute; top:0; bottom:0; background:var(--band); border-left:1px dashed var(--muted); border-right:1px dashed var(--muted)}
.seg{position:absolute; top:50%; height:2px; margin-top:-1px; background:var(--muted)}
.dot{position:absolute; top:50%; width:.72rem; height:.72rem; margin:-.36rem 0 0 -.36rem; border-radius:50%}
.dot.lo{background:var(--surface); border:2px solid var(--ink-2)}
.dot.hi{background:var(--ink-2)}
.hl .seg{background:var(--accent)} .hl .dot.lo{border-color:var(--accent)} .hl .dot.hi{background:var(--accent)}
.hl .c-label, .cur .c-label{color:var(--ink); font-weight:700} .hl .c-val{color:var(--accent-ink)} .cur .c-val{color:var(--ink)}
.bar{position:absolute; left:0; top:.45rem; bottom:.45rem; background:var(--bar); border-radius:0 3px 3px 0}
.hl .bar{background:var(--accent)} .cur .bar{background:var(--cur)}
.grp .c-group{grid-column:1 / -1; font-family:var(--f-mono); font-size:.72rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); padding:.7rem 0 .2rem}
.axis .c-track{height:1.5rem; background:none}
.tick{position:absolute; top:.25rem; transform:translateX(-50%); font-family:var(--f-mono); font-size:.7rem; color:var(--muted); white-space:nowrap}
.tick:first-child{transform:none} .tick:last-child{transform:translateX(-100%)}
.axis .c-val{font-size:.7rem}
.c-note{font-size:.8rem; color:var(--muted); margin:.7rem 0 .25rem; max-width:none}
.c-src{font-size:.75rem; color:var(--muted); font-family:var(--f-mono); margin:0; max-width:none}
@media (max-width:640px){
  .c-row{grid-template-columns:minmax(0,1fr) 5.7rem; grid-template-areas:"lab lab" "trk val"; column-gap:.6rem}
  .c-label{grid-area:lab; text-align:left; font-size:.8rem; padding-top:.3rem}
  .c-track{grid-area:trk; height:1.55rem} .c-val{grid-area:val}
  .axis .c-label{display:none}
  .chart:not(.bars) .tick:nth-child(even){display:none}
  .chart{padding:.9rem .8rem .7rem}
}

/* price-performance matrix */
.pm-scroll{overflow-x:auto}
.pm-hint{display:none; font-size:.8rem; color:var(--muted); margin:0 0 .4rem}
@media (max-width:640px){.pm-hint{display:block}}
.pm{display:block; width:100%; max-width:840px; min-width:620px; height:auto; font-family:var(--f-body); font-size:12px}
.pm-q{fill:var(--accent); fill-opacity:.08}
.pm-grid{stroke:var(--grid)} .pm-axis{stroke:var(--muted)} .pm-ref{stroke:var(--muted); stroke-dasharray:4 4}
.pm-tick, .pm-axt{fill:var(--muted)} .pm-ql{fill:var(--muted); font-weight:700}
.pm-pt circle{fill:var(--bar)} .pm-pt text{fill:var(--ink-2)}
.pm-pt.hl circle{fill:var(--accent)} .pm-pt.hl text{fill:var(--accent-ink); font-weight:700}
.pm-pt.cur circle{fill:var(--ink)} .pm-pt.cur text{fill:var(--ink); font-weight:700}

.be-band{fill:var(--bar); fill-opacity:.3}
.be-p polyline{fill:none; stroke:var(--ink); stroke-width:2.5}
.be-p circle{fill:var(--ink)} .be-p .be-lab{fill:var(--ink); font-weight:700} .be-p .be-val{fill:var(--ink)}
.be-p.hl polyline{stroke:var(--accent)} .be-p.hl circle{fill:var(--accent)} .be-p.hl .be-lab, .be-p.hl .be-val{fill:var(--accent-ink)}

.cpf-band{fill:var(--bar); fill-opacity:.25}
.cpf-p line{stroke:var(--bar); stroke-width:2.5} .cpf-p circle{fill:var(--bar)} .cpf-p circle.lo{fill-opacity:.35; stroke:var(--bar); stroke-width:2} .cpf-p text{fill:var(--ink-2)}
.cpf-p.hl line{stroke:var(--accent)} .cpf-p.hl circle{fill:var(--accent)} .cpf-p.hl circle.lo{stroke:var(--accent)} .cpf-p.hl text{fill:var(--accent-ink); font-weight:700}
.cpf-p.cur line{stroke:var(--ink)} .cpf-p.cur circle{fill:var(--ink)} .cpf-p.cur circle.lo{stroke:var(--ink)} .cpf-p.cur text{fill:var(--ink); font-weight:700}

/* appendix */
.apx-intro{display:flex; flex-wrap:wrap; gap:.75rem 1.5rem; align-items:center; justify-content:space-between; max-width:var(--wide); margin-bottom:1rem}
.apx-intro p{margin:0}
.btn{font:inherit; font-size:.9rem; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:.45rem .9rem; cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
details.apx{border-top:1px solid var(--line)}
details.apx:last-of-type{border-bottom:1px solid var(--line)}
details.apx>summary{list-style:none; cursor:pointer; padding:1rem 0; display:flex; justify-content:space-between; align-items:center; gap:1rem;
  font-family:var(--f-display); font-size:1.25rem; font-weight:600}
details.apx>summary::-webkit-details-marker{display:none}
details.apx>summary::after{content:""; width:.6rem; height:.6rem; border-right:2px solid var(--ink-2); border-bottom:2px solid var(--ink-2); transform:rotate(45deg); margin-right:.3rem; flex:none; transition:transform .15s}
details.apx[open]>summary::after{transform:rotate(-135deg)}
.apx-body{padding-bottom:1.5rem; min-width:0}
.apx-body h4:first-child{margin-top:.25rem}

footer{border-top:1px solid var(--line); margin-top:3rem; padding-block:1.5rem 2.5rem; color:var(--muted); font-size:.85rem}
footer p{margin:0 0 .5rem; max-width:var(--measure)}
footer .f-title{font-weight:700; color:var(--ink-2)}
</style>

<style>
.gate{min-height:100%; display:grid; place-items:center; padding-block:3rem}
.gate form{width:100%; max-width:26rem; display:grid; gap:.75rem}
.gate h1{font-size:1.6rem; font-weight:600; margin:0 0 .25rem}
.gate p{margin:0}
.gate .gate-intro{color:var(--ink-2)}
.gate label[for="pw"]{font-size:.85rem; font-weight:700; color:var(--muted); margin-top:.5rem}
.gate-row{display:flex; gap:.5rem}
.gate input[type="password"]{flex:1; min-width:0; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:.55rem .75rem}
.gate input[type="password"]:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700}
.btn.primary:hover{opacity:.9}
.btn[disabled]{opacity:.6; cursor:progress}
.remember{display:flex; align-items:center; gap:.5rem; font-size:.9rem; color:var(--ink-2)}
.gate-err{color:var(--warn); font-size:.9rem}
html,body{height:100%}
</style>
</head>
<body>
<div id="gate" class="gate">
  <form id="gate-form" autocomplete="on">
    <h1>Geschütztes Dokument</h1>
    <p class="gate-intro">Bitte das Passwort eingeben.</p>
    <label for="pw">Passwort</label>
    <div class="gate-row"><input id="pw" name="password" type="password" autocomplete="current-password" required autofocus><button type="submit" class="btn primary" id="gate-btn">Öffnen</button></div>
    <label class="remember"><input type="checkbox" id="remember"> Auf diesem Gerät merken</label>
    <p id="gate-err" class="gate-err" role="alert" hidden>Das Passwort stimmt nicht. Bitte erneut eingeben.</p>
  </form>
</div>
<div id="content" hidden></div>

  function initPage(){

      var key = await crypto.subtle.importKey('raw', b(saved), 'AES-GCM', false, ['decrypt']);
      show(await decryptWith(key));
    } catch (e) { try { localStorage.removeItem(STORE); } catch (e2) {} }
  })();
  var form = document.getElementById('gate-form'), btn = document.getElementById('gate-btn'), err = document.getElementById('gate-err');
  form.addEventListener('submit', async function(ev){
    ev.preventDefault();
    err.hidden = true; btn.disabled = true; btn.textContent = 'Öffne …';
    try {
      var key = await keyFromPassword(document.getElementById('pw').value);
      var html = await decryptWith(key);
      if (document.getElementById('remember').checked) {
        try { var raw = new Uint8Array(await crypto.subtle.exportKey('raw', key)); var s = ''; for (var i = 0; i < raw.length; i++) s += String.fromCharCode(raw[i]); localStorage.setItem(STORE, btoa(s)); } catch (e) {}
      }
      show(html);
    } catch (e) {
      err.hidden = false; btn.disabled = false; btn.textContent = 'Öffnen';
      document.getElementById('pw').select();
    }
  });
})();
</script>
</body>
</html>
